<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan &amp; China</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            height: 100%;
        }

        body {
            min-height: 100%;
            background: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 5vh 4vw;
            overflow: hidden;
        }

        .slide-header {
            flex-direction: column;
            border-bottom: 1px solid #eee;
        }

        .slide-footer {
            border-top: 1px solid #eee;
            color: #999;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
        }

        h1 {
            font-size: 4rem;
            font-weight: 300;
            letter-spacing: 0.5em;
            margin-left: 0.5em;
        }

        .subtitle {
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.15em;
            color: #666;
            margin-top: 1.5rem;
        }

        .scroll-hint {
            position: absolute;
            bottom: 3rem;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: #999;
            text-transform: uppercase;
        }

        .page-content {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: clamp(1.125rem, 3vw, 2.25rem);
            height: 75vh;
            transform-origin: center center;
        }

        .img-col {
            display: flex;
            flex-direction: column;
            gap: clamp(1.125rem, 3vw, 2.25rem);
            flex: 0 0 auto;
            height: 100%;
        }

        .img-col img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .img-col.multi {
            height: 100%;
        }

        .img-col.multi img {
            width: 100%;
            height: auto;
        }

        .crop-wrapper {
            overflow: hidden;
            height: 100%;
            flex-shrink: 0;
        }

        .crop-wrapper img {
            object-fit: cover;
            width: 100%;
            height: 100%;
        }

        .img-col.multi .crop-wrapper {
            flex: 1 1 0;
            height: auto;
            min-height: 0;
        }

        .crop-1-1 { aspect-ratio: 1 / 1; }
        .crop-2-3 { aspect-ratio: 2 / 3; }
        .crop-3-2 { aspect-ratio: 3 / 2; }
        .crop-248-183 { aspect-ratio: 248 / 183; }

        /* Rotate prompt for mobile portrait */
        .rotate-prompt {
            display: none;
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .rotate-prompt svg {
            width: 64px;
            height: 64px;
            margin-bottom: 2rem;
            animation: rotate-hint 2s ease-in-out infinite;
        }

        @keyframes rotate-hint {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(90deg); }
        }

        .rotate-prompt p {
            font-size: 1rem;
            color: #666;
            letter-spacing: 0.1em;
        }

        @media (max-width: 900px) and (orientation: portrait) {
            .rotate-prompt {
                display: flex;
            }

            .swiper, .progress, .page-number {
                display: none;
            }
        }

        /* Mobile landscape adjustments */
        @media (max-height: 500px) {
            h1 {
                font-size: 2rem;
                letter-spacing: 0.3em;
                margin-left: 0.3em;
            }

            .subtitle {
                font-size: 0.7rem;
                margin-top: 0.75rem;
            }

            .scroll-hint {
                font-size: 0.6rem;
                bottom: 1.5rem;
            }

            .swiper-slide {
                padding: 5vh 2vw;
            }

            .page-content {
                gap: 0.5rem;
            }

            .img-col {
                gap: 0.5rem;
            }

            .page-number {
                bottom: 0.5rem;
                right: 0.5rem;
                font-size: 0.6rem;
            }
        }

        .progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 2px;
            background: #000;
            width: 0%;
            z-index: 100;
            transition: width 0.1s, opacity 0.2s ease;
        }

        .page-number {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            font-size: 0.75rem;
            color: #999;
            letter-spacing: 0.1em;
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        /* The viewer's backdrop is translucent, so the book's own chrome is
           told to step out while a photo is up. */
        html.lightbox-open .page-number,
        html.lightbox-open .progress {
            opacity: 0;
        }
        /*
         * Desktop (mouse/trackpad): fixed viewport, Swiper transforms give
         * smooth one-slide-at-a-time snapping in Chrome/Firefox/Safari.
         */
        @media (hover: hover) and (pointer: fine) {
            html, body {
                height: 100dvh;
                overflow: hidden;
            }

            .scroll-hint .hint-touch,
            .lightbox-hint .hint-touch {
                display: none;
            }

            .lightbox-open body {
                overflow: hidden;
            }
        }

        @media not all and (hover: hover) and (pointer: fine) {
            .scroll-hint .hint-desktop,
            .lightbox-hint .hint-desktop {
                display: none;
            }
        }

        /*
         * Lightbox: tapping a photo "windows it out" to fullscreen. The frame
         * is parked at its fullscreen geometry and animated with a transform
         * from the tapped photo's on-screen rect (FLIP), so the photo appears
         * to lift off the page and grow, instead of fading in somewhere else.
         */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 2000;
            pointer-events: none;
        }

        .lightbox.open {
            pointer-events: auto;
            cursor: zoom-out;
            /* Gestures inside the overlay must never scroll the document
               behind it (the touch layout scrolls the page itself). */
            touch-action: none;
        }

        .lightbox-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(252, 252, 252, 0.93);
            -webkit-backdrop-filter: blur(18px) saturate(1.05);
            backdrop-filter: blur(18px) saturate(1.05);
            opacity: 0;
            transition: opacity 340ms ease;
        }

        .lightbox.open .lightbox-backdrop {
            opacity: 1;
        }

        .lightbox-frame {
            position: absolute;
            visibility: hidden;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.13), 0 2px 8px rgba(0, 0, 0, 0.06);
            transform-origin: 0 0;
            will-change: transform;
        }

        .lightbox.open .lightbox-frame {
            visibility: visible;
        }

        .lightbox-frame img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            -webkit-user-drag: none;
        }

        .lightbox-ui {
            position: absolute;
            color: #999;
            font-size: 0.6875rem;
            font-family: inherit;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* Hidden until the viewer is open, and clickable only then:
               otherwise the label sits over the book and the button eats
               taps meant for the photos. */
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
        }

        .lightbox.open .lightbox-ui {
            opacity: 1;
            pointer-events: auto;
            transition-delay: 160ms;
        }

        .lightbox-close {
            top: calc(3vh + env(safe-area-inset-top, 0px));
            right: calc(3vw + env(safe-area-inset-right, 0px));
            padding: 0.5rem;
            background: none;
            border: 0;
            cursor: pointer;
        }

        .lightbox-close:hover {
            color: #000;
        }

        /* The dialog itself takes focus on open; it must not paint a ring. */
        .lightbox:focus {
            outline: none;
        }

        .lightbox-hint {
            bottom: calc(3vh + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        @media (max-height: 500px) {
            .lightbox-ui {
                font-size: 0.5625rem;
            }

            .lightbox-close {
                top: 1.5vh;
                right: 2vw;
            }

            .lightbox-hint {
                bottom: 1.5vh;
            }
        }

        .swiper-slide img {
            cursor: zoom-in;
            -webkit-tap-highlight-color: transparent;
        }

        /*
         * Touch devices: browsers only collapse their URL/tab bar when the
         * *document* itself scrolls natively. Swiper's transform mode (and
         * even its cssMode, which scrolls an inner container) never scrolls
         * the document, so mobile Safari keeps its chrome visible no matter
         * what. Here we let the page scroll natively and get snapping from
         * CSS scroll-snap, which iOS Safari honours on touch drags.
         */
        @media not all and (hover: hover) and (pointer: fine) {
            html {
                scroll-snap-type: y mandatory;
                overscroll-behavior-y: none;
            }

            /* Neutralise Swiper's container styles; slides stack in flow */
            .swiper {
                height: auto;
                overflow: visible;
            }

            .swiper-wrapper {
                display: block;
                transform: none !important;
            }

            .swiper-slide {
                position: relative;
                /* The grid is pixel-locked (--slide-h, set by JS) while
                   scrolling so snap positions can never shift mid-flick.
                   JS updates --slide-h to the live viewport height only
                   when the page is at rest, then re-anchors the scroll to
                   the same slide, so slides always exactly fill the
                   viewport while you are looking at one. */
                height: var(--slide-h, 100svh);
                scroll-snap-align: start;
                padding: 3svh 2vw;
            }

            .page-content {
                height: 100%; /* fill the slide; scaling clamps width */
            }
        }

    </style>
</head>
<body>
    <div class="rotate-prompt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="4" y="2" width="16" height="20" rx="2" />
            <line x1="12" y1="18" x2="12" y2="18.01" stroke-width="2" stroke-linecap="round" />
        </svg>
        <p>Rotate your device to landscape</p>
    </div>

    <div class="progress" id="progress"></div>

    <div class="swiper" id="photobook">
        <div class="swiper-wrapper" id="slides"></div>
    </div>

    <div class="page-number" id="pageNumber"></div>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true" tabindex="-1">
        <div class="lightbox-backdrop"></div>
        <figure class="lightbox-frame" id="lightboxFrame">
            <img id="lightboxImg" alt="" draggable="false">
        </figure>
        <button class="lightbox-ui lightbox-close" id="lightboxClose" type="button">&#10005; Close</button>
        <div class="lightbox-ui lightbox-hint">
            <span class="hint-touch">Tap or swipe to close</span>
            <span class="hint-desktop">Tap anywhere or press Esc</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        let layout = null;
        let swiper = null;

        async function init() {
            const response = await fetch('layout.json');
            layout = await response.json();
            renderSlides();
            initSwiper();
        }

        function getImagePath(filename) {
            return `images/optimized/${filename}`;
        }

        // Mobile browsers abort in-flight lazy image requests during fast
        // fling scrolling, which can leave images permanently broken.
        // Retry failed loads, and re-request anything still broken when a
        // slide becomes active.
        function retryBrokenImages(slide) {
            slide.querySelectorAll('img').forEach(img => {
                if (img.complete && img.naturalWidth === 0) {
                    const src = img.getAttribute('src');
                    img.removeAttribute('src');
                    img.setAttribute('src', src);
                }
            });
        }

        document.addEventListener('error', (e) => {
            const img = e.target;
            if (img.tagName !== 'IMG') return;
            const tries = +(img.dataset.tries || 0);
            if (tries >= 3) return;
            img.dataset.tries = tries + 1;
            setTimeout(() => {
                const src = img.getAttribute('src');
                img.removeAttribute('src');
                img.setAttribute('src', src);
            }, 300 * (tries + 1));
        }, true);

        function renderSlides() {
            const container = document.getElementById('slides');
            let html = '';

            // Header slide
            html += `
                <div class="swiper-slide slide-header">
                    <h1>JAPAN &amp; CHINA</h1>
                    <p class="subtitle">by Tim Kraus & Robin Beerman</p>
                    <div class="scroll-hint"><span class="hint-touch">Swipe to explore</span><span class="hint-desktop">Scroll to explore</span></div>
                </div>
            `;

            // Photo spreads
            layout.spreads.forEach((spread, index) => {
                const allImages = [];
                spread.pages.forEach(page => {
                    page.images.forEach(img => {
                        allImages.push({
                            filename: img.filename,
                            left: img.position.left,
                            top: img.position.top,
                            width: img.position.width,
                            height: img.position.height,
                            crop: img.crop || null,
                            cropPosition: img.cropPosition || null,
                            cropZoom: img.cropZoom || null
                        });
                    });
                });

                allImages.sort((a, b) => a.left - b.left);

                const columns = [];
                allImages.forEach(img => {
                    const existingCol = columns.find(col =>
                        Math.abs(col[0].left - img.left) < 300
                    );
                    if (existingCol) {
                        existingCol.push(img);
                    } else {
                        columns.push([img]);
                    }
                });

                columns.forEach(col => col.sort((a, b) => a.top - b.top));

                function renderImg(img) {
                    const styles = [];
                    if (img.cropPosition) styles.push(`object-position: ${img.cropPosition}`);
                    if (img.cropZoom) styles.push(`transform: scale(${img.cropZoom})`);
                    if (!img.crop) {
                        // Reserve space before the file decodes so column
                        // widths and scaling don't jump as images load in.
                        styles.push(`aspect-ratio: ${img.width} / ${img.height}`);
                    }
                    const styleAttr = styles.length ? `style="${styles.join('; ')}"` : '';

                    if (img.crop) {
                        const cropClass = 'crop-' + img.crop.replace(':', '-');
                        return `<div class="crop-wrapper ${cropClass}">
                            <img src="${getImagePath(img.filename)}" alt="" loading="lazy" ${styleAttr}>
                        </div>`;
                    }
                    return `<img src="${getImagePath(img.filename)}" alt="" loading="lazy">`;
                }

                html += `
                    <div class="swiper-slide" data-page="${index + 1}">
                        <div class="page-content">
                            ${columns.map(col => `
                                <div class="img-col ${col.length > 1 ? 'multi' : ''}">
                                    ${col.map(img => renderImg(img)).join('')}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            // Footer slide
            html += `
                <div class="swiper-slide slide-footer">
                    <span>End</span>
                </div>
            `;

            container.innerHTML = html;
        }

        function initSwiper() {
            const totalSlides = layout.spreads.length;
            const progressBar = document.getElementById('progress');
            const pageNumber = document.getElementById('pageNumber');

            function updateUI(index, slideCount) {
                const progress = (index / (slideCount - 1)) * 100;
                progressBar.style.width = `${progress}%`;

                // Update page number (skip header, adjust for footer)
                if (index === 0 || index === slideCount - 1) {
                    pageNumber.textContent = '';
                } else {
                    pageNumber.textContent = `${index} / ${totalSlides}`;
                }
            }

            // Apply scaling when images load
            document.addEventListener('load', (e) => {
                if (e.target.tagName === 'IMG') {
                    applyScaling();
                }
            }, true);

            window.addEventListener('load', applyScaling);

            // Touch devices: rely on native document scrolling with CSS
            // scroll-snap (see the touch media query in the styles) so that
            // mobile Safari/Chrome hide their browser chrome. Just track the
            // active slide with an observer instead of Swiper events.
            const isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
            if (!isDesktop) {
                const slides = Array.from(document.querySelectorAll('.swiper-slide'));
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            updateUI(slides.indexOf(entry.target), slides.length);
                            retryBrokenImages(entry.target);
                        }
                    });
                }, { threshold: 0.55 });
                slides.forEach(slide => observer.observe(slide));
                updateUI(0, slides.length);
                setTimeout(applyScaling, 100);
                window.addEventListener('resize', applyScaling);

                // The slide grid is pixel-locked (--slide-h, set by JS)
                // while scrolling: snap positions are frozen through any
                // touch or fling, so Safari's chrome animation cannot
                // rescale the grid mid-flick (that rescale was the 2-3
                // slide jump on direction reversal). Once scrolling has
                // truly settled and the chrome stopped animating, the grid
                // is resized exactly once to the current viewport and the
                // scroll re-anchored to the same slide. At rest the slide
                // therefore always fills the viewport precisely - no gap,
                // no strip, no painted-over anything. The same re-anchor
                // repairs any off-snap resting position.
                let touching = false;
                document.addEventListener('touchstart', () => { touching = true; }, { passive: true });
                document.addEventListener('touchend', () => {
                    touching = false;
                    scheduleSettle();
                }, { passive: true });

                const rootStyle = document.documentElement.style;
                const currentSlideH = () => slides[1].offsetTop - slides[0].offsetTop;
                const setLockedHeight = h => rootStyle.setProperty('--slide-h', h + 'px');
                setLockedHeight(window.innerHeight);

                function settle() {
                    if (touching) return;
                    if (lbPhase !== 'closed') return; // viewer is up; leave the grid alone
                    const h = currentSlideH();
                    if (!h) return;
                    const idx = Math.round(window.scrollY / h);
                    const vh = window.innerHeight;
                    if (Math.abs(vh - h) > 1) {
                        // The chrome toggled while at rest: resize the grid
                        // to the viewport and keep the same slide anchored.
                        setLockedHeight(vh);
                        requestAnimationFrame(() => {
                            applyScaling();
                            window.scrollTo(0, idx * vh);
                        });
                        return;
                    }
                    const target = idx * h;
                    if (Math.abs(window.scrollY - target) > 4) {
                        window.scrollTo({ top: target, behavior: 'smooth' });
                    }
                }
                function scheduleSettle() {
                    settleTimers.forEach(clearTimeout);
                    settleTimers = [150, 450, 800].map(d => setTimeout(settle, d));
                }
                let settleTimers = [];

                window.addEventListener('scroll', scheduleSettle, { passive: true });
                // Nothing happens on resize itself (that IS the chrome
                // animating); only the quiet afterwards triggers a settle.
                window.addEventListener('resize', scheduleSettle);
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', scheduleSettle);
                    window.visualViewport.addEventListener('scroll', scheduleSettle);
                }
                return;
            }

            // Desktop: Swiper transforms give smooth, one-slide-at-a-time
            // snapping with the mousewheel in Chrome, Safari and Firefox.
            swiper = new Swiper('#photobook', {
                direction: 'vertical',
                mousewheel: true,
                keyboard: true,
                speed: 600,
                on: {
                    slideChange: function() {
                        updateUI(this.activeIndex, this.slides.length);
                        retryBrokenImages(this.slides[this.activeIndex]);
                    },
                    init: function() {
                        // Apply scaling after init
                        setTimeout(applyScaling, 100);
                    },
                    resize: function() {
                        applyScaling();
                    }
                }
            });
        }

        function itemAspect(el) {
            // Display aspect of a column item: design ratio for crops,
            // natural ratio for plain images.
            if (el.classList.contains('crop-wrapper')) {
                const m = el.className.match(/crop-(\d+)-(\d+)/);
                if (m) return +m[1] / +m[2];
            }
            const im = el.tagName === 'IMG' ? el : el.querySelector('img');
            if (im && im.naturalWidth) return im.naturalWidth / im.naturalHeight;
            return 1;
        }

        function applyScaling() {
            const maxWidth = window.innerWidth * 0.92;

            document.querySelectorAll('.page-content').forEach(pc => {
                pc.style.transform = '';
                const H = pc.clientHeight;
                if (!H) return;

                Array.from(pc.children).forEach(col => {
                    const items = Array.from(col.children);
                    if (!items.length) return;
                    const aspects = items.map(itemAspect);

                    if (items.length === 1) {
                        // Single crop: width must follow design ratio;
                        // older iOS Safari ignores CSS aspect-ratio here.
                        if (items[0].classList.contains('crop-wrapper')) {
                            items[0].style.width = (H * aspects[0]) + 'px';
                            items[0].style.height = H + 'px';
                        }
                        return;
                    }

                    // Multi-image column: derive one shared width so every
                    // image's box fits exactly (heights sum to column
                    // height) — no letterboxed flex boxes misaligning
                    // bottoms.
                    const gap = parseFloat(getComputedStyle(col).rowGap) || 0;
                    const inv = aspects.reduce((a, r) => a + 1 / r, 0);
                    const W = (H - gap * (items.length - 1)) / inv;
                    col.style.width = W + 'px';
                    items.forEach((it, i) => {
                        it.style.width = W + 'px';
                        it.style.height = (W / aspects[i]) + 'px';
                    });
                });

                const contentWidth = pc.scrollWidth;
                if (contentWidth > maxWidth) {
                    const scale = maxWidth / contentWidth;
                    pc.style.transform = `scale(${scale})`;
                }
            });
        }

        /* -------------------- Lightbox: window a photo out -------------------- */

        const lightbox = document.getElementById('lightbox');
        const lbFrame = document.getElementById('lightboxFrame');
        const lbImg = document.getElementById('lightboxImg');
        const lbBackdrop = lightbox.querySelector('.lightbox-backdrop');

        const LB_EASE = 'cubic-bezier(.22, .8, .28, 1)';
        const LB_OPEN_MS = 420;
        const LB_CLOSE_MS = 340;
        const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        let lbPhase = 'closed';   // closed -> opening -> open -> closing
        let lbSource = null;      // the <img> that was tapped
        let lbFinal = null;       // fullscreen rect the frame animates to/from
        let lbReturnFocus = null; // where focus goes when the viewer closes

        // A tap that turns into a drag (mobile fling, trackpad twitch) must
        // never open or close the viewer.
        const TAP_TOLERANCE = 12;
        let pressX = null, pressY = null, lbIgnoreClick = false;

        function notePress(x, y) {
            pressX = x;
            pressY = y;
            // A swipe that preventDefault()ed its own click must not leave a
            // stale suppression behind for the next tap.
            lbIgnoreClick = false;
        }
        // A tap moved beyond the tolerance since it went down.
        function draggedSincePress(e) {
            const moved = pressX !== null &&
                Math.hypot(e.clientX - pressX, e.clientY - pressY) > TAP_TOLERANCE;
            pressX = pressY = null;
            return moved;
        }

        // Pointer events for the desktop, touch events as the fallback for
        // engines that deliver taps without them.
        document.addEventListener('pointerdown', (e) => notePress(e.clientX, e.clientY), { passive: true });
        document.addEventListener('touchstart', (e) => {
            const t = e.touches[0];
            if (t) notePress(t.clientX, t.clientY);
        }, { passive: true });

        document.getElementById('slides').addEventListener('click', (e) => {
            const img = e.target.closest('img');
            if (!img || lbPhase !== 'closed') return;
            if (draggedSincePress(e)) return;
            openLightbox(img);
        });

        // Where the tapped photo actually is on screen. Cropped photos are
        // clipped by their wrapper (and can be zoomed with a transform), so
        // the honest start rect is the photo's rect intersected with the clip.
        function sourceRect(img) {
            const r = img.getBoundingClientRect();
            let left = r.left, top = r.top, right = r.right, bottom = r.bottom;
            const clip = img.closest('.crop-wrapper');
            if (clip) {
                const c = clip.getBoundingClientRect();
                left = Math.max(left, c.left);
                top = Math.max(top, c.top);
                right = Math.min(right, c.right);
                bottom = Math.min(bottom, c.bottom);
            }
            return { left, top, width: right - left, height: bottom - top };
        }

        // env(safe-area-inset-*) cannot be read from JS, so measure a probe.
        // Keeps the fullscreen photo clear of a phone notch in landscape.
        const safeProbe = document.createElement('div');
        safeProbe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;visibility:hidden;'
            + 'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);'
            + 'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
        document.head.appendChild(safeProbe);

        function safeInsets() {
            const cs = getComputedStyle(safeProbe);
            return {
                top: parseFloat(cs.paddingTop) || 0,
                right: parseFloat(cs.paddingRight) || 0,
                bottom: parseFloat(cs.paddingBottom) || 0,
                left: parseFloat(cs.paddingLeft) || 0
            };
        }

        // Fullscreen geometry for a photo of this aspect, with a margin that
        // keeps a little breathing room on every edge.
        function targetRect(ratio) {
            const safe = safeInsets();
            const pad = Math.round(Math.min(innerWidth, innerHeight) * 0.05);
            const availW = innerWidth - pad * 2 - safe.left - safe.right;
            const availH = innerHeight - pad * 2 - safe.top - safe.bottom;
            let width = Math.min(availW, availH * ratio);
            let height = width / ratio;
            if (height > availH) {
                height = availH;
                width = height * ratio;
            }
            return {
                left: safe.left + pad + (availW - width) / 2,
                top: safe.top + pad + (availH - height) / 2,
                width,
                height
            };
        }

        // Transform that puts the (fullscreen-geometry) frame exactly on a
        // given rect. With transform-origin at the frame's own top-left, the
        // per-axis scales land on the rect's size directly.
        function flipTransform(rect) {
            const sx = rect.width / lbFinal.width;
            const sy = rect.height / lbFinal.height;
            const dx = rect.left - lbFinal.left;
            const dy = rect.top - lbFinal.top;
            return `translate(${dx}px, ${dy}px) scale(${sx}, ${sy})`;
        }

        const REST_TRANSFORM = 'translate(0px, 0px) scale(1, 1)';

        function setTransform(tf, ms) {
            lbFrame.style.transition = ms ? `transform ${ms}ms ${LB_EASE}` : 'none';
            lbFrame.style.transform = tf;
        }

        // transitionend plus a safety timeout (a tab that goes to background
        // mid-animation never fires the event).
        function afterFrame(ms, done) {
            let finished = false;
            const finish = (e) => {
                if (e && (e.target !== lbFrame || e.propertyName !== 'transform')) return;
                if (finished) return;
                finished = true;
                lbFrame.removeEventListener('transitionend', finish);
                clearTimeout(timer);
                done();
            };
            lbFrame.addEventListener('transitionend', finish);
            const timer = setTimeout(finish, ms + 150);
        }

        function lockBookBehind(on) {
            document.documentElement.classList.toggle('lightbox-open', on);
            lightbox.setAttribute('aria-hidden', on ? 'false' : 'true');
            // Swiper's keyboard control is bound to the document, so its arrow
            // keys would page the book behind the viewer.
            if (swiper && swiper.keyboard) {
                if (on) swiper.keyboard.disable(); else swiper.keyboard.enable();
            }
        }

        function openLightbox(img) {
            const natural = img.naturalWidth && img.naturalHeight
                ? img.naturalWidth / img.naturalHeight
                : (img.clientWidth / Math.max(1, img.clientHeight)) || 1;

            lbSource = img;
            lbFinal = targetRect(natural);

            lbImg.src = img.currentSrc || img.src;
            lbBackdrop.style.opacity = '';
            lbFrame.style.left = lbFinal.left + 'px';
            lbFrame.style.top = lbFinal.top + 'px';
            lbFrame.style.width = lbFinal.width + 'px';
            lbFrame.style.height = lbFinal.height + 'px';

            lightbox.classList.add('open');
            lockBookBehind(true);

            const from = sourceRect(img);
            lbPhase = 'opening';
            if (REDUCED_MOTION || from.width < 4 || from.height < 4) {
                setTransform(REST_TRANSFORM, 0);
            } else {
                setTransform(flipTransform(from), 0);
                void lbFrame.offsetWidth; // commit the start geometry
                requestAnimationFrame(() => setTransform(REST_TRANSFORM, LB_OPEN_MS));
            }
            lbImg.decode().catch(() => {});
            afterFrame(LB_OPEN_MS, () => { if (lbPhase === 'opening') lbPhase = 'open'; });
            // Focus the dialog (not a control) so Escape/Tab start inside it,
            // and remember where to hand focus back to.
            lbReturnFocus = document.activeElement;
            lightbox.focus({ preventScroll: true });
        }

        function closeLightbox() {
            if (lbPhase === 'closed' || lbPhase === 'closing') return;
            lbPhase = 'closing';

            let to = lbSource && lbSource.isConnected ? sourceRect(lbSource) : null;
            if (!to || to.width < 4 || to.height < 4 ||
                to.right < 0 || to.bottom < 0 ||
                to.left > innerWidth || to.top > innerHeight) {
                // The photo scrolled or resized out of view while we were
                // looking at it: shrink towards the centre instead.
                const w = lbFinal.width * 0.4, h = lbFinal.height * 0.4;
                to = {
                    left: lbFinal.left + (lbFinal.width - w) / 2,
                    top: lbFinal.top + (lbFinal.height - h) / 2,
                    width: w,
                    height: h
                };
            }

            const ms = REDUCED_MOTION ? 0 : LB_CLOSE_MS;
            lbBackdrop.style.opacity = '0'; // fade the veil out with the photo
            setTransform(flipTransform(to), ms);

            afterFrame(ms, () => {
                lightbox.classList.remove('open');
                lockBookBehind(false);
                lbFrame.style.transition = 'none';
                lbFrame.style.transform = '';
                lbImg.removeAttribute('src');
                lbPhase = 'closed';
                if (lbReturnFocus && lbReturnFocus.focus) lbReturnFocus.focus({ preventScroll: true });
                lbReturnFocus = null;
                // The photo may have finished decoding while we were looking
                // at it, which changes its natural size and therefore the
                // column geometry.
                applyScaling();
            });
        }

        // Rotate or resize while the photo is up: re-fit it to the new
        // viewport. The transform (and the close animation's maths) stay
        // relative to this geometry, so nothing has to be re-animated.
        window.addEventListener('resize', () => {
            if (lbPhase === 'closed') return;
            const ratio = lbImg.naturalWidth && lbImg.naturalHeight
                ? lbImg.naturalWidth / lbImg.naturalHeight
                : lbFinal.width / lbFinal.height;
            lbFinal = targetRect(ratio);
            lbFrame.style.left = lbFinal.left + 'px';
            lbFrame.style.top = lbFinal.top + 'px';
            lbFrame.style.width = lbFinal.width + 'px';
            lbFrame.style.height = lbFinal.height + 'px';
        });

        // Close on tap anywhere (the whole overlay is the close target).
        lightbox.addEventListener('click', (e) => {
            if (lbIgnoreClick) {
                lbIgnoreClick = false;
                return;
            }
            if (draggedSincePress(e)) return;
            closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (lbPhase === 'closed') return;
            if (e.key === 'Escape' || e.key === 'ArrowUp') {
                e.preventDefault();
                closeLightbox();
            } else if (['ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Home', 'End'].includes(e.key)) {
                e.preventDefault();
            }
        });

        // Drag the photo with your finger; let go past a threshold (or flick)
        // and it windows back out to where it came from.
        let dragging = false, dragX = 0, dragY = 0, lastX = 0, lastY = 0, lastT = 0, speed = 0;

        lightbox.addEventListener('touchstart', (e) => {
            if (lbPhase === 'closed' || e.touches.length > 1) return;
            dragging = true;
            dragX = dragY = 0;
            speed = 0;
            const t = e.touches[0];
            lastX = t.clientX;
            lastY = t.clientY;
            lastT = e.timeStamp;
        }, { passive: true });

        lightbox.addEventListener('touchmove', (e) => {
            if (!dragging || lbPhase === 'closed') return;
            const t = e.touches[0];
            const dx = t.clientX - lastX;
            const dy = t.clientY - lastY;
            const dt = Math.max(1, e.timeStamp - lastT);
            speed = Math.hypot(dx, dy) / dt;
            lastX = t.clientX;
            lastY = t.clientY;
            lastT = e.timeStamp;

            dragX += dx;
            dragY += dy;
            const far = Math.hypot(dragX, dragY);
            if (far > TAP_TOLERANCE) {
                e.preventDefault();
                lbIgnoreClick = true;
                // Keep the transform structure identical to the FLIP ones so
                // the browser interpolates translate/scale component-wise.
                if (lbPhase === 'open' || lbPhase === 'opening') {
                    lbFrame.style.transition = 'none';
                    lbFrame.style.transform = `translate(${dragX}px, ${dragY}px) scale(1, 1)`;
                    lbBackdrop.style.opacity = String(Math.max(0.35, 1 - far / 900));
                }
            }
        }, { passive: false });

        function endDrag() {
            if (!dragging) return;
            dragging = false;
            if (lbPhase === 'closed') return;
            if (Math.hypot(dragX, dragY) > 70 || speed > 0.6) {
                closeLightbox();
            } else if (dragX || dragY) {
                lbFrame.style.transition = `transform 300ms ${LB_EASE}`;
                lbFrame.style.transform = REST_TRANSFORM;
                lbBackdrop.style.opacity = '';
            }
        }
        lightbox.addEventListener('touchend', endDrag, { passive: true });
        lightbox.addEventListener('touchcancel', endDrag, { passive: true });

        // Remote debugging: open the page with ?debug to overlay live
        // layout numbers so a screenshot can diagnose device-only issues.
        const DEBUG = new URLSearchParams(location.search).has('debug');
        function debugDump() {
            if (!DEBUG) return;
            const slides = Array.from(document.querySelectorAll('.swiper-slide'));
            if (slides.length < 2) return;
            const slideH = slides[1].offsetTop - slides[0].offsetTop;
            const idx = Math.min(slides.length - 1, Math.max(0, Math.round(scrollY / (slideH || 1))));
            const slide = slides[idx];
            const doc = document.documentElement;
            let el = document.getElementById('debugOverlay');
            if (!el) {
                el = document.createElement('pre');
                el.id = 'debugOverlay';
                el.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;background:rgba(255,255,255,0.92);font:10px/1.35 monospace;padding:6px;pointer-events:none;color:#000;max-width:60vw';
                document.body.appendChild(el);
            }
            const lines = [
                `desktop=${matchMedia('(hover: hover) and (pointer: fine)').matches} scrollY=${Math.round(scrollY)} slideH=${Math.round(slideH)}`,
                `vw=${innerWidth} vh=${innerHeight} docW=${doc.scrollWidth} docH=${doc.scrollHeight} dpr=${devicePixelRatio}`,
                `locked=${document.documentElement.style.getPropertyValue('--slide-h') || 'unset'} gap=${Math.round(innerHeight - slideH)}`
            ];
            lines.push(`slide[${idx}] rect=${Math.round(slide.getBoundingClientRect().width)}x${Math.round(slide.getBoundingClientRect().height)} pos=${Math.round(slide.getBoundingClientRect().top)} pad=${getComputedStyle(slide).padding}`);
            const pc = slide.querySelector('.page-content');
            if (pc) {
                const r = pc.getBoundingClientRect();
                lines.push(`pc css-h=${getComputedStyle(pc).height} rect=${Math.round(r.width)}x${Math.round(r.height)} scrollW=${pc.scrollWidth} tf="${pc.style.transform || 'none'}"`);
                Array.from(pc.children).forEach((col, ci) => {
                    const cr = col.getBoundingClientRect();
                    const kids = Array.from(col.children).map(k => {
                        const kr = k.getBoundingClientRect();
                        return `${k.tagName}:${Math.round(kr.width)}x${Math.round(kr.height)}`;
                    }).join(' ');
                    lines.push(`  col${ci} rect=${Math.round(cr.width)}x${Math.round(cr.height)} [${kids}]`);
                });
                pc.querySelectorAll('img').forEach((im, ii) => {
                    const cs = getComputedStyle(im);
                    lines.push(`   img${ii} nat=${im.naturalWidth}x${im.naturalHeight} rect=${Math.round(im.getBoundingClientRect().width)}x${Math.round(im.getBoundingClientRect().height)} fit=${cs.objectFit} ar=${cs.aspectRatio} complete=${im.complete} st="${im.getAttribute('style') || ''}"`);
                });
            }
            el.textContent = lines.join('\n');
        }
        if (DEBUG) {
            window.addEventListener('scroll', debugDump, { passive: true });
            window.addEventListener('resize', debugDump);
            setInterval(debugDump, 700);
        }

        init();
    </script>
</body>
</html>
